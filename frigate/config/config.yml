mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  stats_interval: 60

detectors:
  ov:
    type: openvino
    device: GPU          # NOT CPU — see gotchas

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

classification:
  bird:
    enabled: true        # disabled by default
    threshold: 0.65      # default 0.9 is very high; start lower and tighten

birdseye:
  enabled: false         # pointless with one camera

cameras:
  feeder:
    enabled: true
    ffmpeg:
      # Set explicitly, not because the value differs from what Frigate picks on
      # its own, but because 0.17 auto-detects hwaccel and a commented-out block
      # does NOT disable it -- the running process kept showing -hwaccel vaapi
      # while the config looked clean. Verify with:
      #   docker exec frigate ps aux | grep ffmpeg
      #
      # VA-API was recorded as failing in pass 11 against a corrupt RTSP stream from
      # the out-of-band publisher; hardware decoders reject invalid streams that
      # software decode conceals. Now settled against the real camera node:
      # 1600x1200 h264 over RTSP decodes clean at 7.18ms inference, 10.0
      # process_fps, zero skipped frames. Closes open question #2. To force
      # software decode for comparison use `hwaccel_args: []` -- an empty list,
      # never a comment.
      hwaccel_args: preset-vaapi
      inputs:
          - path: rtsp://wildlife-pi.banklington:8554/feeder
            roles: [detect]
    detect:
      enabled: true
      width: 1664
      height: 1248
      fps: 10
    objects:
      track:
        - bird
        # - cat    # optional: catches squirrels/mammals, COCO has no squirrel
    snapshots:
      enabled: true
      clean_copy: true     # un-annotated copy for iNat
      timestamp: false
      bounding_box: false
      quality: 95          # default 70 leaves visible compression artifacts
      retain:
        default: 60
    record:
      # Live camera. Recording was off through the bench phase because the input
      # was a looped file -- every segment was the same footage rewritten. Real
      # camera input is not reproducible, so it is worth keeping.
      enabled: true
      # Frigate 0.17 renamed record.retain to record.continuous, and
      # continuous.days already defaults to 0. Keeping both at 0 is the
      # event-only posture the build plan wants: no rolling 24/7 buffer.
      continuous:
        days: 0
      motion:
        days: 0
      # These are the real retention lever, not continuous. They were 0 while
      # the 126 GB of bench recordings expired; 30 days is the plan's figure.
      # Watch the disk over the first few days -- /mnt/storage is on the OS
      # drive, and this is the first time these windows have seen a live feed.
      alerts:
        retain: {days: 30}
      detections:
        retain: {days: 30}
    motion:
      #   threshold    - luminance delta, 1-255. Geometry independent, so it
      #                  carried over from the bench unchanged.
      #   contour_area - measured against a frame Frigate downscales to
      #                  motion.frame_height (100px), so it is independent of
      #                  detect resolution but not of framing. Re-check against
      #                  the real scene rather than assuming it transferred.
      #   mask         - REMOVED. The bench polygon masked 44% of a frame with a
      #                  different aspect ratio and a different scene, so on the
      #                  real camera it covered arbitrary geography. Redraw in
      #                  Settings -> Motion Tuner once you can see what actually
      #                  moves, and mask the background vegetation, never the
      #                  zone where birds land.
      # Target from the build plan: detect/sec under ~20. Wind-moved vegetation
      # drove it to ~104 on the bench fixture.
      threshold: 30
      contour_area: 15
version: 0.17-0
