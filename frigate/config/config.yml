mqtt:
  enabled: true
  host: mosquitto
  port: 1883
  topic_prefix: frigate
  stats_interval: 60

detectors:
  ov:
    type: openvino
    device: GPU          # NOT CPU — see gotchas

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

classification:
  bird:
    enabled: true        # disabled by default
    threshold: 0.65      # default 0.9 is very high; start lower and tighten

birdseye:
  enabled: false         # pointless with one camera

cameras:
  feeder:
    enabled: true
    ffmpeg:
      # Set explicitly, not because the value differs from what Frigate picks on
      # its own, but because 0.17 auto-detects hwaccel and a commented-out block
      # does NOT disable it -- the running process kept showing -hwaccel vaapi
      # while the config looked clean. Verify with:
      #   docker exec frigate ps aux | grep ffmpeg
      #
      # VA-API was recorded as failing in pass 11, but that was against a corrupt
      # RTSP stream from the out-of-band publisher; hardware decoders reject
      # invalid streams that software decode conceals. With Frigate looping the
      # fixture directly it decodes clean: 6.54ms inference, 10.0 process_fps,
      # ~15% iGPU. To force software decode for a comparison, use `hwaccel_args: []`
      # -- an empty list, never a comment.
      hwaccel_args: preset-vaapi
      inputs:
        - path: /media/frigate/feeder-fixture.mp4
          input_args: -re -stream_loop -1
          roles: [detect]
    #  inputs:
    #    #- path: rtsp://<node_ip>:8554/cam
    #    - path: rtsp://mediamtx:8554/feeder
    #      roles: [detect]
    detect:
      enabled: true
      width: 2028
      height: 1520
      fps: 10
    objects:
      track:
        - bird
        # - cat    # optional: catches squirrels/mammals, COCO has no squirrel
    snapshots:
      enabled: true
      clean_copy: true     # un-annotated copy for iNat
      timestamp: false
      bounding_box: false
      quality: 95          # default 70 leaves visible compression artifacts
      retain:
        default: 60
    record:
      # Bench posture: the detect input loops feeder-fixture.mp4, so every
      # recorded segment is the same footage rewritten. Detection,
      # classification, snapshots, and MQTT events are unaffected -- none of
      # the Phase 1 acceptance tests read recordings. Re-enable when the real
      # camera lands in Phase 2.
      enabled: false
      # Frigate 0.17 renamed record.retain to record.continuous, and
      # continuous.days already defaults to 0 -- so the build plan's
      # "retain.days: 0" was both an invalid key here and a no-op. The 126 GB
      # came from detections.retain instead. Spelled out for the record:
      continuous:
        days: 0
      motion:
        days: 0
      # Retention is 0 while the existing bench recordings expire. Restore
      # alerts and detections to 30 days with the camera in Phase 2.
      alerts:
        retain: {days: 0}
      detections:
        retain: {days: 0}
    motion:
      # What survives the move to the real camera, and what does not:
      #   threshold    - luminance delta, 1-255. Geometry independent. Transfers.
      #   contour_area - measured against a frame Frigate downscales to
      #                  motion.frame_height (100px), so it does not depend on
      #                  detect resolution. It does depend on framing: a bird
      #                  fills more of the production frame than of this
      #                  fixture, which is ~2.7x wider. Re-check rather than
      #                  re-derive.
      #   mask         - fractional coordinates tied to this exact scene.
      #                  Discard it and redraw against real camera input using
      #                  Settings -> Motion Tuner.
      # Target from the build plan: detect/sec under ~20. Wind-moved vegetation
      # drove it to ~104 and detect CPU to 154% on the bench.
      threshold: 30
      contour_area: 15
      mask: 
        0.001,0.498,0.094,0.353,0.224,0.341,0.349,0.185,0.737,0.199,0.76,0.394,0.757,0.521,0.746,0.68,0.688,0.999,0.994,0.992,0.996,0.009,0.002,0.006
version: 0.17-0
